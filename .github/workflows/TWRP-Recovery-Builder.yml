name: TWRP Recovery Builder 2024

on:
  workflow_dispatch:
    inputs:
      MANIFEST_BRANCH:
        description: 'TWRP Minimal-Manifest Branch'
        required: true
        default: ''
        type: choice
        options:
        - twrp-14.1
        - twrp-12.1
        - twrp-11
        - twrp-9.0
      DEVICE_TREE:
        description: 'Custom Recovery Tree' 
        required: true
        default: 'https://github.com/Aleksandrl39/Infinix-X663_device_tree_firmware_670'
      DEVICE_TREE_BRANCH:
        description: 'Custom Recovery Tree Branch' 
        required: true
        default: 'main'
      DEVICE_PATH:
        description: 'Specify your Device Path' 
        required: true
        default: 'device/infinix/Infinix_X663'
      DEVICE_NAME:
        description: 'Specify your Device Codename' 
        required: true
        default: 'Infinix_X663'
      BUILD_TARGET:
        description: 'Specify your Build Target' 
        required: true
        default: 'boot'
        type: choice
        options:
        - boot
        - recovery
        - vendorboot
      LDCHECK:
        description: 'Path of blobs to check' 
        required: true
        default: 'vendor/bin/tee'
      RECOVERY_TAR:
        description: 'Release Recovery.tar For Samsung devices'
        required: false
        default: false
        type: boolean
      RECOVERY_INSTALLER:
        description: 'Include recovery installer.zip'
        type: boolean
        required: true
        default: false
jobs:
  build:
    name: Build TWRP by ${{ github.actor }}
    runs-on: ubuntu-22.04
    if: github.event.repository.owner.id == github.event.sender.id
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write
    steps:
    - name: Check Out
      uses: actions/checkout@v3
      
    - name: Display Inputs
      run: |
        echo "::group::User Environment Variables"
        echo "Displaying variables/inputs."
        echo "Manifest Branch: ${{ github.event.inputs.MANIFEST_BRANCH }}"
        echo "Device Tree: ${{ github.event.inputs.DEVICE_TREE }}"
        echo "Device Branch: ${{ github.event.inputs.DEVICE_TREE_BRANCH }}"
        echo "Device Path: ${{ github.event.inputs.DEVICE_PATH }}"
        echo "Device Name: ${{ github.event.inputs.DEVICE_NAME }}"
        echo "Build Target: ${{ github.event.inputs.BUILD_TARGET }}image"
        echo "Include Recovery Installer: ${{ github.event.inputs.RECOVERY_INSTALLER }}"
        echo "Release recovery.tar For Samsung devices: ${{ github.event.inputs.RECOVERY_TAR }}"
        echo "::endgroup::"

    - name: Cleanup
      uses: rokibhasansagar/slimhub_actions@main
        
    - name: Prepare the environment
      run: |
        sudo apt update
        sudo apt -y upgrade
        sudo apt -y install gperf gcc-multilib gcc-10-multilib g++-multilib g++-10-multilib lib32ncurses5-dev x11proto-core-dev lib32z-dev libgl1-mesa-dev libxml2-utils xsltproc bc ccache lib32readline-dev lib32z1-dev liblz4-tool libncurses5-dev libsdl1.2-dev libwxgtk3.0-gtk3-dev lzop pngcrush schedtool squashfs-tools imagemagick libbz2-dev lzma ncftp qemu-user-static libstdc++-10-dev libtinfo5 libgflags-dev
        sudo add-apt-repository universe
        sudo apt -y install libncurses5

    - name: Install OpenJDK
      uses: actions/setup-java@v4
      with:
        distribution: zulu
        java-version: 8

    - name: Install Git-Repo
      run: |
        mkdir ~/bin
        curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
        chmod a+x ~/bin/repo
        sudo ln -sf ~/bin/repo /usr/bin/repo

    - name: Check Manifest Branch
      uses: haya14busa/action-cond@v1
      id: manifest
      with:
        cond: ${{ github.event.inputs.MANIFEST_BRANCH == 'twrp-11' || github.event.inputs.MANIFEST_BRANCH == 'twrp-12.1'  || github.event.inputs.MANIFEST_BRANCH == 'twrp-14.1' }}
        if_true: https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git
        if_false: https://github.com/minimal-manifest-twrp/platform_manifest_twrp_omni.git

    - name: Initialize Repo
      run: |
        mkdir workspace
        cd workspace
        git config --global user.name "Samuel Kendall"
        git config --global user.email "kinguser981@gmail.com"
        repo init --depth=1 -u ${{ steps.manifest.outputs.value }} -b ${{ github.event.inputs.MANIFEST_BRANCH }}
  
    - name: Repo Sync
      run: |
        cd workspace
        repo sync -j$(nproc --all) --force-sync

    - name: Clone Device Tree
      run: |
        cd workspace
        git clone ${{ github.event.inputs.DEVICE_TREE }} -b ${{ github.event.inputs.DEVICE_TREE_BRANCH }} ./${{ github.event.inputs.DEVICE_PATH }}
        cd ${{ github.event.inputs.DEVICE_PATH }}
        echo "COMMIT_ID=$(git rev-parse HEAD)" >> $GITHUB_ENV

    - name: Rename Makefiles
      run: |
        cd workspace/${{ github.event.inputs.DEVICE_PATH }}
        
        # Переименовываем файлы с тире
        if [ -f "omni_Infinix-X663.mk" ]; then
          mv "omni_Infinix-X663.mk" "omni_Infinix_X663.mk"
        fi
        if [ -f "twrp_Infinix-X663.mk" ]; then
          mv "twrp_Infinix-X663.mk" "twrp_Infinix_X663.mk"
        fi
        
        echo "Makefiles renamed"
      continue-on-error: true

    - name: Fix Dashes in Device Tree
      run: |
        cd workspace/${{ github.event.inputs.DEVICE_PATH }}
        echo "Fixing dashes in device tree..."
        
        # Заменяем ВСЕ вхождения Infinix-X663 на Infinix_X663
        find . -type f \( -name "*.mk" -o -name "*.sh" -o -name "*.bp" \) -exec sed -i 's/Infinix-X663/Infinix_X663/g' {} \;
        
        # Также исправляем в путях
        find . -type f \( -name "*.mk" -o -name "*.sh" -o -name "*.bp" \) -exec sed -i 's|device/infinix/Infinix-X663|device/infinix/Infinix_X663|g' {} \;
        
        echo "Dashes fixed successfully"
      continue-on-error: true

    - name: Check Build Makefile
      run: |
        cd workspace
        # Экранируем тире в имени устройства
        DEVICE_NAME_ESCAPED="${{ github.event.inputs.DEVICE_NAME }}"
        # Пробуем разные варианты именования
        if [ -f "${{ github.event.inputs.DEVICE_PATH }}/twrp_${DEVICE_NAME_ESCAPED}.mk" ]; then
            echo "DEVICE_MAKEFILE=twrp_${{ github.event.inputs.DEVICE_NAME }}" >> $GITHUB_ENV
        elif [ -f "${{ github.event.inputs.DEVICE_PATH }}/omni_${DEVICE_NAME_ESCAPED}.mk" ]; then
            echo "DEVICE_MAKEFILE=omni_${{ github.event.inputs.DEVICE_NAME }}" >> $GITHUB_ENV
        elif [ -f "${{ github.event.inputs.DEVICE_PATH }}/twrp_${DEVICE_NAME_ESCAPED//-/_}.mk" ]; then
            echo "DEVICE_MAKEFILE=twrp_${DEVICE_NAME_ESCAPED//-/_}" >> $GITHUB_ENV
        elif [ -f "${{ github.event.inputs.DEVICE_PATH }}/omni_${DEVICE_NAME_ESCAPED//-/_}.mk" ]; then
            echo "DEVICE_MAKEFILE=omni_${DEVICE_NAME_ESCAPED//-/_}" >> $GITHUB_ENV
        else
            echo "No recovery makefile found! Available files:"
            ls -la ${{ github.event.inputs.DEVICE_PATH }}/*.mk || true
            exit 1
        fi
      continue-on-error: true

    - name: Fix Boot Control HAL Conflict
      run: |
        cd workspace/${{ github.event.inputs.DEVICE_PATH }}
        
        # Комментируем статический HAL, оставляем только динамический
        sed -i '/PRODUCT_STATIC_BOOT_CONTROL_HAL/,/^[^#]/ s/^/# /' device.mk
        sed -i 's/^PRODUCT_STATIC_BOOT_CONTROL_HAL/# PRODUCT_STATIC_BOOT_CONTROL_HAL/' device.mk
        
        echo "Boot Control HAL conflict resolved"
  
    - name: Install Python 2
      if: github.event.inputs.MANIFEST_BRANCH != 'twrp-11' && github.event.inputs.MANIFEST_BRANCH != 'twrp-12.1'  && github.event.inputs.MANIFEST_BRANCH != 'twrp-14'
      run: |
        sudo apt -y install python2
        cd /usr/bin
        sudo ln -sf python2 python

    - name: Building Image 
      run: |
        cd workspace
        source build/envsetup.sh
        export ALLOW_MISSING_DEPENDENCIES=true
        
        # Экранируем имя устройства с тире
        LUNCH_TARGET="${{ env.DEVICE_MAKEFILE }}-eng"
        echo "Lunch target: $LUNCH_TARGET"
        
        # Используем кавычки для lunch команды
        lunch "$LUNCH_TARGET" 
        make clean
        make ${{ github.event.inputs.BUILD_TARGET }}image -j$(nproc --all)
        echo "Done building your ${{ github.event.inputs.BUILD_TARGET }}.img"
      continue-on-error: true
      
    - name: Set Build Date # Output will be use in Release
      run: |
        echo "BUILD_DATE=$(date +%Y%m%d)" >> $GITHUB_ENV
        DEVICE_TREE_URL="${{ github.event.inputs.DEVICE_TREE }}"
        if [[ "${DEVICE_TREE_URL}" == *.git ]]; then
          DEVICE_TREE_URL="${DEVICE_TREE_URL%.git}"
        fi
        echo "DEVICE_TREE_URL=${DEVICE_TREE_URL}" >> $GITHUB_ENV

    - name: Check if Recovery Exist
      run: |
        cd workspace/out/target/product
        
        # Находим фактическую папку с устройством (может отличаться из-за тире)
        ACTUAL_DEVICE_DIR="${{ github.event.inputs.DEVICE_NAME }}"
        if [ ! -d "$ACTUAL_DEVICE_DIR" ]; then
          # Пробуем найти папку с заменой тире на подчеркивание
          ALT_DEVICE_DIR="${ACTUAL_DEVICE_DIR//-/_}"
          if [ -d "$ALT_DEVICE_DIR" ]; then
            ACTUAL_DEVICE_DIR="$ALT_DEVICE_DIR"
            echo "Using alternative device directory: $ACTUAL_DEVICE_DIR"
          else
            echo "Available device directories:"
            ls -la
            echo "Device directory '$ACTUAL_DEVICE_DIR' not found!"
            exit 1
          fi
        fi
        
        cd "$ACTUAL_DEVICE_DIR"
        
        # Проверяем существующие образы
        if [ -f "recovery.img" ]; then
            echo "RECOVERY_TYPE=recovery" >> $GITHUB_ENV
            echo "ACTUAL_DEVICE_DIR=$ACTUAL_DEVICE_DIR" >> $GITHUB_ENV
            echo "recovery.img file found!"
            echo "MD5_IMG=$(md5sum recovery.img | cut -d ' ' -f 1)" >> $GITHUB_ENV
        elif [ -f "boot.img" ]; then
            echo "RECOVERY_TYPE=boot" >> $GITHUB_ENV
            echo "ACTUAL_DEVICE_DIR=$ACTUAL_DEVICE_DIR" >> $GITHUB_ENV
            echo "boot.img file found!"
            echo "MD5_IMG=$(md5sum boot.img | cut -d ' ' -f 1)" >> $GITHUB_ENV
        elif [ -f "vendor_boot.img" ]; then
            echo "RECOVERY_TYPE=vendor_boot" >> $GITHUB_ENV
            echo "ACTUAL_DEVICE_DIR=$ACTUAL_DEVICE_DIR" >> $GITHUB_ENV
            echo "vendor_boot.img file found!"
            echo "MD5_IMG=$(md5sum vendor_boot.img | cut -d ' ' -f 1)" >> $GITHUB_ENV
        else
            echo "Available files:"
            ls -la *.img || true
            echo "No recovery file found!"
            exit 1
        fi
      continue-on-error: true

    - name: Recovery to tar for Samsung devices
      run: |
        if [ ${{ github.event.inputs.RECOVERY_TAR }} = true ]; then
          cd workspace/out/target/product/${{ env.ACTUAL_DEVICE_DIR }}
          tar -cvf ${{ env.RECOVERY_TYPE }}.tar ${{ env.RECOVERY_TYPE }}.img
        fi
      continue-on-error: true
        
    - name: Upload to Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          workspace/out/target/product/${{ env.ACTUAL_DEVICE_DIR }}/${{ env.RECOVERY_TYPE }}.tar
          workspace/out/target/product/${{ env.ACTUAL_DEVICE_DIR }}/recovery-installer.zip
          workspace/out/target/product/${{ env.ACTUAL_DEVICE_DIR }}/${{ env.RECOVERY_TYPE }}.img
        name: Unofficial TWRP for ${{ github.event.inputs.DEVICE_NAME }} // ${{ env.BUILD_DATE }}
        tag_name: ${{ github.run_id }}
        body: |
          Device: ${{ github.event.inputs.DEVICE_NAME }}
          Build Type: ${{ env.RECOVERY_TYPE }}.img
          MD5: ${{ env.MD5_IMG }}

    - name: Release ramdisk-recovery
      uses: softprops/action-gh-release@v1
      with:
        files: |
          workspace/out/target/product/${{ env.ACTUAL_DEVICE_DIR }}/obj/PACKAGING/vendor_ramdisk_fragments_intermediates/recovery.*
          workspace/out/target/product/${{ env.ACTUAL_DEVICE_DIR }}/ramdisk-recovery.*
        name: Ramdisk files for ${{ github.event.inputs.DEVICE_NAME }}
        tag_name: ramdisk-${{ github.run_id }}
          
    - name: Checking For Missing Dependencies
      run: |
        cd tools
        mv -n libneeds ${GITHUB_WORKSPACE}/workspace/out/target/product/${{ github.event.inputs.DEVICE_NAME }}/recovery/root/
        mv -n ldcheck ${GITHUB_WORKSPACE}/workspace/out/target/product/${{ github.event.inputs.DEVICE_NAME }}/recovery/root/
        cd ../workspace/out/target/product/${{ github.event.inputs.DEVICE_NAME }}/recovery/root
        python3 ldcheck -p system/lib64:vendor/lib64:system/lib:vendor/lib -d ${{ github.event.inputs.LDCHECK }}
        echo "Done checking missing dependencies. Review, and reconfigure your tree."
      continue-on-error: true
